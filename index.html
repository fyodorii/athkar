<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>مواقيت</title>
    <meta name="description" content="مواقيت الصلاة والأذكار، متابعة العبادات، الختمة، السنن الرواتب، الديون وحاسبة التاريخ الهجري — مع تنبيهات." />
    <meta name="theme-color" content="#2c6fcc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="مواقيت" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/alt/emerald.png?v=4" />
    <link rel="preload" href="fonts/tajawal-arabic-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/tajawal-arabic-700.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <script>
      // Set the theme before the first paint so dark mode never flashes white.
      try {
        var st = JSON.parse(localStorage.getItem('adhkar-app:v1') || '{}').settings || {};
        var t = st.theme || 'auto';
        if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark';
          document.querySelector('meta[name=theme-color]').content = '#101b30';
        }
        // The chosen fonts, before the first paint (same stacks as FONTS in js/ui.js).
        var sys = "-apple-system, 'SF Arabic', 'Geeza Pro', system-ui, sans-serif";
        var f = { tajawal: "'Tajawal', " + sys, cairo: "'Cairo', " + sys, plex: "'Plex', " + sys, vazirmatn: "'Vazirmatn', " + sys, amiri: "'Amiri', serif", lateef: "'Lateef', 'Amiri', serif", ruqaa: "'Aref Ruqaa', 'Amiri', serif" };
        var r = document.documentElement.style;
        if (f[st.fontText]) r.setProperty('--font-text', f[st.fontText]);
        if (f[st.fontUi]) r.setProperty('--font-ui', f[st.fontUi]);
        if (st.textWeight) r.setProperty('--text-weight', st.textWeight);
        if (f[st.fontTsb]) r.setProperty('--font-tsb', f[st.fontTsb]);
        if (st.tsbWeight) r.setProperty('--tsb-weight', st.tsbWeight);
        if (st.uiWeight) r.setProperty('--ui-weight', st.uiWeight);
        if (st.headScale) r.setProperty('--head-scale', st.headScale);
        if (st.flat !== false) document.documentElement.setAttribute('data-flat', ''); // flat unless turned off
        // The app colour (see ACCENTS in js/ui.js); the light status bar takes its main colour.
        var acc = { sage: '#2f6b5c', blue: '#2c6fcc', green: '#1f8a6e', teal: '#12819a', violet: '#6b4fc8', rose: '#b8455e', gold: '#a87420', graphite: '#3d4a5c' };
        var a = acc[st.accent] ? st.accent : 'blue';
        document.documentElement.dataset.accent = a;
        if (document.documentElement.dataset.theme !== 'dark') document.querySelector('meta[name=theme-color]').content = (location.hash === '' || location.hash === '#/home' ? (function (h) { return '#' + [1, 3, 5].map(function (i) { var v = Math.round(parseInt(h.substr(i, 2), 16) * 0.42 + parseInt('e6e7ee'.substr(i - 1, 2), 16) * 0.58); return ('0' + v.toString(16)).slice(-2); }).join(''); })(acc[a]) : acc[a]);
        // The home-screen icon chosen in the settings (or ?icon= in a shared link); iOS reads it
        // when the app is added to the home screen.
        var ic = new URLSearchParams(location.search).get('icon') || st.appIcon;
        if (['sky', 'night', 'violet', 'parchment', 'black', 'burgundy', 'gold'].indexOf(ic) < 0) ic = 'emerald'; // the default is the green one
        document.querySelector('link[rel=apple-touch-icon]').href = 'icons/alt/' + ic + '.png?v=4';
      } catch (e) {}
    </script>
  </head>
  <body>
    <main id="view" class="view"></main>
    <div id="mini" class="mini" hidden></div>
    <div id="nav-backdrop"></div>
    <nav id="tabs" aria-label="الأقسام"></nav>
    <div id="sheet-root"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript><p style="padding: 2rem; text-align: center">يحتاج التطبيق إلى تفعيل JavaScript.</p></noscript>
    <script type="module" src="js/app.js"></script>
    <script>
      // A safety net: if the app has not started after a few seconds (a broken saved copy on the
      // device), clear the saved copy and load the app afresh from the internet, once; if it still
      // does not start, say so with the error and a button to try again.
      (function () {
        var errors = [];
        window.addEventListener('error', function (e) { errors.push(e.message || (e.target && (e.target.src || e.target.href)) || 'error'); }, true);
        window.addEventListener('unhandledrejection', function (e) { errors.push(String((e.reason && e.reason.message) || e.reason)); });
        var started = function () { var v = document.getElementById('view'); return document.documentElement.classList.contains('ready') && v && v.children.length > 0; };
        var repair = function () {
          try { sessionStorage.setItem('adhkar-app:repair', '1'); } catch (e) {}
          var jobs = [];
          if (window.caches) jobs.push(caches.keys().then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); }));
          if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); }));
          // The browser's own cache may keep older copies of some files for a few minutes after an
          // update: ask the internet again for every file this page loaded, so all are the same release.
          try {
            var seen = {};
            (performance.getEntriesByType('resource') || []).forEach(function (r) {
              var u = r.name.split('#')[0];
              if (u.indexOf(location.origin) === 0 && !seen[u]) { seen[u] = 1; jobs.push(fetch(u, { cache: 'reload' }).catch(function () {})); }
            });
            jobs.push(fetch(location.pathname, { cache: 'reload' }).catch(function () {}));
          } catch (e) {}
          Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
        };
        setTimeout(function () {
          if (started()) return;
          var tried = false;
          try { tried = sessionStorage.getItem('adhkar-app:repair') === '1'; } catch (e) {}
          if (!tried) return repair();
          var box = document.createElement('div');
          box.setAttribute('style', 'position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;background:#eef3fb;color:#0e1b33;font:16px -apple-system,system-ui,sans-serif;direction:rtl');
          box.innerHTML = '<b style="font-size:20px">تعذر تشغيل التطبيق</b><span>تأكد من الاتصال بالإنترنت ثم اضغط «إعادة المحاولة».</span><button style="padding:12px 22px;border:0;border-radius:14px;background:#2c6fcc;color:#fff;font:inherit;font-weight:700">إعادة المحاولة</button><small style="direction:ltr;opacity:.6;max-width:90vw;word-break:break-word"></small>';
          box.querySelector('small').textContent = errors.slice(0, 3).join(' | ');
          box.querySelector('button').onclick = repair;
          document.body.appendChild(box);
          // Which file the browser cannot load, and why: each of the app's modules is loaded on its
          // own and the first ones that fail are listed with their error.
          fetch('sw.js', { cache: 'reload' }).then(function (r) { return r.text(); }).then(function (t) {
            var files = (t.match(/'js\/[^']+\.js'/g) || []).map(function (x) { return x.slice(1, -1); }).filter(function (f) { return f !== 'js/app.js'; });
            var bad = [];
            return files.reduce(function (p, f) {
              return p.then(function () {
                return import('./' + f + '?diag=' + Date.now()).catch(function (e) { bad.push(f + ': ' + ((e && (e.name + ': ' + e.message)) || e)); });
              });
            }, Promise.resolve()).then(function () {
              return import('./js/app.js?diag=' + Date.now()).then(function () { bad.push('app.js: ok'); }, function (e) { bad.push('app.js: ' + ((e && (e.name + ': ' + e.message)) || e)); });
            }).then(function () {
              box.querySelector('small').textContent = bad.slice(0, 6).join(' | ') || errors.join(' | ');
            });
          }).catch(function () {});
          var check = setInterval(function () { if (started()) { box.remove(); clearInterval(check); } }, 1000);
        }, 8000);
      })();
    </script>
  </body>
</html>
